name: build-exe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - run: pyinstaller --noconfirm --onedir --windowed --splash assets/splash.png --name InvoiceAuto main.py
      - shell: bash
        run: |
          mkdir -p package
          cp -r dist/InvoiceAuto package/
          cp "InvoiceAuto 실행.bat" package/
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceAuto
          path: package/
