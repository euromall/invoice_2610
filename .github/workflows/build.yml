name: build-exe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller==6.11.1
      - run: pyinstaller --noconfirm --onefile --windowed --splash assets/splash.png --name InvoiceAuto main.py
      - uses: actions/upload-artifact@v4
        with:
          name: InvoiceAuto
          path: dist/InvoiceAuto.exe
